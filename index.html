<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jayed.tech</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        /* Grid fills the *visible* viewport (avoid taskbar clipping) */
        .grid {
            position: fixed;
            inset: 0; /* top:0; right:0; bottom:0; left:0; */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            /* dynamic viewport units where supported; fallback to 100vh */
            height: 100dvh;
            height: 100svh;
            height: 100vh;
            width: 100%; /* avoid 100vw to prevent including scrollbars */
            overflow: hidden;
            will-change: transform;
            min-width: 0; /* allow children to shrink without causing overflow */
            min-height: 0;
        }

        /* Make GIFs always fill their grid cell (stretching allowed) */
        .grid img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            /* allow shrinking to avoid pushing layout */
            min-width: 0;
            min-height: 0;
            max-width: 100%;
            max-height: 100%;
            /* entrance animation */
            animation: tornado 900ms cubic-bezier(.2,.9,.3,1) both;
        }

        /* Per-item starting transforms for the 'tornado' effect */
        .grid img:nth-child(1) { --start: translate(-140vw, -90vh) rotate(-1080deg) scale(1.8); animation-delay: 0.05s; }
        .grid img:nth-child(2) { --start: translate(0, -120vh) rotate(-900deg) scale(1.6); animation-delay: 0.12s; }
        .grid img:nth-child(3) { --start: translate(140vw, -90vh) rotate(-1080deg) scale(1.8); animation-delay: 0.18s; }
        .grid img:nth-child(4) { --start: translate(-160vw, 90vh) rotate(1080deg) scale(1.8); animation-delay: 0.24s; }
        .grid img:nth-child(5) { --start: translate(0, 120vh) rotate(900deg) scale(1.6); animation-delay: 0.30s; }
        .grid img:nth-child(6) { --start: translate(160vw, 90vh) rotate(1080deg) scale(1.8); animation-delay: 0.36s; }

        @keyframes tornado {
            0% {
                transform: var(--start, translate(0, -80vh) rotate(-720deg) scale(1.6));
                filter: blur(6px) saturate(0.6);
                opacity: 0;
            }
            55% {
                opacity: 1;
                filter: blur(2px) saturate(0.9);
            }
            85% {
                filter: blur(0px) saturate(1);
            }
            100% {
                transform: none;
                filter: none;
                opacity: 1;
            }
        }

        /* Respect prefers-reduced-motion */
        @media (prefers-reduced-motion: reduce) {
            .grid img { animation: none; }
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        .play-btn {
            pointer-events: all;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 6px solid red;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
            text-align: center;
            padding: 16px;
            box-shadow: 0 0 0 4px rgba(255,0,0,0.3), 0 0 40px rgba(255,0,0,0.4);
        }

        .play-btn:hover { transform: scale(1.06); background: rgba(0,0,0,0.8); }
        .play-btn:active { transform: scale(0.97); }

        .play-btn svg { width: 48px; height: 48px; fill: red; }

        .play-btn.hidden { display: none; }
    </style>
</head>
<body>

    <div class="grid" id="grid">
        <img src="gif1.gif" alt="">
        <img src="gif2.gif" alt="">
        <img src="gif3.gif" alt="">
        <img src="gif4.gif" alt="">
        <img src="gif5.gif" alt="">
        <img src="gif6.gif" alt="">
    </div>

    <audio id="phonk" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="overlay">
        <button class="play-btn" id="playBtn" onclick="startMusic()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5v14l11-7z"/>
            </svg>
            Click here to play phonk
        </button>
    </div>

    <script>
        function startMusic() {
            document.getElementById('phonk').play();
            document.getElementById('playBtn').classList.add('hidden');
        }
    </script>

</body>
</html>
