<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jayed.tech</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        .grid {
            display: grid;
            width: 100vw;
            height: 100dvh;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        .grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* PLAY BUTTON OVERLAY */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        .play-btn {
            pointer-events: all;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 6px solid red;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
            text-align: center;
            padding: 16px;
            box-shadow: 0 0 0 4px rgba(255,0,0,0.3), 0 0 40px rgba(255,0,0,0.4);
        }

        .play-btn:hover {
            transform: scale(1.06);
            background: rgba(0, 0, 0, 0.8);
        }

        .play-btn:active {
            transform: scale(0.97);
        }

        .play-btn svg {
            width: 48px;
            height: 48px;
            fill: red;
        }

        .play-btn.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="grid">
        <img src="gif1.gif" alt="">
        <img src="gif2.gif" alt="">
        <img src="gif3.gif" alt="">
        <img src="gif4.gif" alt="">
        <img src="gif5.gif" alt="">
        <img src="gif6.gif" alt="">
    </div>

    <audio id="phonk" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="overlay">
        <button class="play-btn" id="playBtn" onclick="startMusic()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5v14l11-7z"/>
            </svg>
            Click here to play phonk
        </button>
    </div>

    <script>
        function startMusic() {
            const audio = document.getElementById('phonk');
            const btn = document.getElementById('playBtn');
            audio.play();
            btn.classList.add('hidden');
        }
    </script>

</body>
</html>
